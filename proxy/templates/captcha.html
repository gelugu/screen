<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>:: SCANNING ::</title>
<script src="https://www.google.com/recaptcha/api.js?render={{.RecaptchaSiteKey}}"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  background: #000;
  color: #00ff41;
  font-family: 'Courier New', Courier, monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.12) 3px,
    rgba(0,0,0,.12) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.wrap {
  width: 100%;
  max-width: 440px;
  padding: 20px;
}

.box {
  border: 2px solid #00ff41;
  padding: 44px 40px 40px;
  position: relative;
  box-shadow:
    0 0 30px rgba(0,255,65,.2),
    0 0 60px rgba(0,255,65,.05),
    inset 0 0 30px rgba(0,255,65,.03);
}

.tag-top {
  position: absolute;
  top: -11px;
  left: 20px;
  background: #000;
  padding: 0 8px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #ff0060;
  text-shadow: 0 0 8px rgba(255,0,96,.5);
}

.tag-tr { position: absolute; top: 8px; right: 12px; font-size: 9px; color: #1a4a1a; letter-spacing: 1px; }
.tag-bl { position: absolute; bottom: 8px; left: 12px; font-size: 9px; color: #1a4a1a; letter-spacing: 1px; }
.tag-br { position: absolute; bottom: 8px; right: 12px; font-size: 9px; color: #1a4a1a; letter-spacing: 1px; }

h1 {
  font-size: 36px;
  letter-spacing: 10px;
  text-transform: uppercase;
  margin-bottom: 8px;
  text-shadow: 0 0 10px #00ff41;
  line-height: 1;
}

.cursor { animation: blink .8s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.sub {
  font-size: 10px;
  letter-spacing: 4px;
  color: #2a5a2a;
  text-transform: uppercase;
  margin-bottom: 36px;
}

.bar-wrap {
  height: 4px;
  background: #0d2a0d;
  margin-bottom: 28px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #00ff41;
  box-shadow: 0 0 8px #00ff41;
  animation: scan 1.6s ease-in-out infinite;
}

@keyframes scan {
  0%   { width: 0%;  margin-left: 0%;   }
  50%  { width: 60%; margin-left: 20%;  }
  100% { width: 0%;  margin-left: 100%; }
}

.status-line {
  font-size: 11px;
  letter-spacing: 3px;
  color: #2a5a2a;
}

.status-line span { color: #00ff41; }

.err {
  border: 1px solid #ff0060;
  background: rgba(255,0,96,.06);
  color: #ff0060;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 10px 14px;
  margin-bottom: 24px;
  text-shadow: 0 0 8px rgba(255,0,96,.6);
}

button {
  width: 100%;
  background: transparent;
  border: 2px solid #ff0060;
  color: #ff0060;
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 6px;
  text-transform: uppercase;
  padding: 14px;
  cursor: pointer;
  transition: background .1s, color .1s;
  display: block;
}

button:hover { background: #ff0060; color: #000; }

.grecaptcha-badge { visibility: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <span class="tag-top">// BOT_DETECTION</span>
    <span class="tag-tr">◆ PROT/1.0</span>
    <span class="tag-bl">HOST::{{.Domain}}</span>
    <span class="tag-br">SYS://SCAN</span>

    {{if .Error}}
    <h1>BLOCKED<span class="cursor">_</span></h1>
    <p class="sub">&gt;_ verification failed</p>
    <div class="err">▸ SCORE BELOW THRESHOLD — SUSPECTED BOT ACTIVITY</div>
    <form id="captcha-form" method="POST" action="/__protect/captcha">
      <input type="hidden" name="d" value="{{.Domain}}">
      <input type="hidden" name="p" value="{{.Path}}">
      <input type="hidden" name="back" value="{{.Back}}">
      <input type="hidden" name="g-recaptcha-response" id="token">
      <button type="button" onclick="runCaptcha()">[ RETRY ]</button>
    </form>
    {{else}}
    <h1>SCANNING<span class="cursor">_</span></h1>
    <p class="sub">&gt;_ analyzing request signature</p>
    <div class="bar-wrap"><div class="bar"></div></div>
    <p class="status-line">STATUS: <span id="status-text">INITIALIZING</span></p>
    <form id="captcha-form" method="POST" action="/__protect/captcha">
      <input type="hidden" name="d" value="{{.Domain}}">
      <input type="hidden" name="p" value="{{.Path}}">
      <input type="hidden" name="back" value="{{.Back}}">
      <input type="hidden" name="g-recaptcha-response" id="token">
    </form>
    {{end}}
  </div>
</div>
<script>
var siteKey = '{{.RecaptchaSiteKey}}';

function runCaptcha() {
  grecaptcha.ready(function() {
    var el = document.getElementById('status-text');
    if (el) el.textContent = 'SCANNING';
    grecaptcha.execute(siteKey, {action: 'protect'}).then(function(token) {
      document.getElementById('token').value = token;
      if (el) el.textContent = 'VERIFIED';
      document.getElementById('captcha-form').submit();
    });
  });
}

{{if not .Error}}runCaptcha();{{end}}
</script>
</body>
</html>
