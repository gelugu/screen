<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>:: ACCESS ::</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  background: #000;
  color: #00ff41;
  font-family: 'Courier New', Courier, monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.12) 3px,
    rgba(0,0,0,.12) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.wrap {
  width: 100%;
  max-width: 440px;
  padding: 20px;
}

.box {
  border: 2px solid #00ff41;
  padding: 44px 40px 40px;
  position: relative;
  box-shadow:
    0 0 30px rgba(0,255,65,.2),
    0 0 60px rgba(0,255,65,.05),
    inset 0 0 30px rgba(0,255,65,.03);
}

.tag-top {
  position: absolute;
  top: -11px;
  left: 20px;
  background: #000;
  padding: 0 8px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #ff0060;
  text-shadow: 0 0 8px rgba(255,0,96,.5);
}

.tag-tr {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 9px;
  color: #1a4a1a;
  letter-spacing: 1px;
}

.tag-bl {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-size: 9px;
  color: #1a4a1a;
  letter-spacing: 1px;
}

.tag-br {
  position: absolute;
  bottom: 8px;
  right: 12px;
  font-size: 9px;
  color: #1a4a1a;
  letter-spacing: 1px;
}

h1 {
  font-size: 42px;
  letter-spacing: 14px;
  text-transform: uppercase;
  margin-bottom: 8px;
  animation: glitch 6s infinite;
  line-height: 1;
}

@keyframes glitch {
  0%,92%,100% {
    text-shadow: 0 0 10px #00ff41;
    transform: none;
  }
  93% {
    text-shadow: 4px 0 #ff0060, -4px 0 #0ff;
    transform: skewX(-2deg);
    color: #aaffaa;
  }
  94% {
    text-shadow: -3px 0 #ff0060, 3px 0 #0ff;
    transform: skewX(1deg);
  }
  95% {
    text-shadow: 0 0 10px #00ff41;
    transform: none;
    color: #00ff41;
  }
  96% {
    text-shadow: 2px 0 #ff0060, -2px 0 #0ff;
    transform: translate(2px, 0);
  }
  97% {
    text-shadow: 0 0 10px #00ff41;
    transform: none;
  }
}

.cursor {
  animation: blink .8s step-end infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0; }
}

.sub {
  font-size: 10px;
  letter-spacing: 4px;
  color: #2a5a2a;
  text-transform: uppercase;
  margin-bottom: 36px;
}

.err {
  border: 1px solid #ff0060;
  background: rgba(255,0,96,.06);
  color: #ff0060;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 10px 14px;
  margin-bottom: 24px;
  text-shadow: 0 0 8px rgba(255,0,96,.6);
  animation: shake .3s ease;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-6px); }
  40%     { transform: translateX(6px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}

label {
  display: block;
  font-size: 9px;
  letter-spacing: 5px;
  color: #2a5a2a;
  text-transform: uppercase;
  margin-bottom: 10px;
}

input[type=text] {
  width: 100%;
  background: #000;
  border: 2px solid #00ff41;
  color: #00ff41;
  font-family: 'Courier New', Courier, monospace;
  font-size: 34px;
  letter-spacing: 14px;
  text-align: center;
  padding: 16px 20px;
  outline: none;
  display: block;
  margin-bottom: 28px;
  transition: box-shadow .15s, border-color .15s;
  -webkit-text-security: none;
}

input[type=text]::placeholder {
  color: #0d2a0d;
  letter-spacing: 10px;
}

input[type=text]:focus {
  border-color: #aaffaa;
  box-shadow: 0 0 20px rgba(0,255,65,.4), inset 0 0 10px rgba(0,255,65,.05);
}

button {
  width: 100%;
  background: transparent;
  border: 2px solid #00ff41;
  color: #00ff41;
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 6px;
  text-transform: uppercase;
  padding: 15px;
  cursor: pointer;
  transition: background .1s, color .1s, box-shadow .1s;
  display: block;
}

button:hover {
  background: #00ff41;
  color: #000;
  box-shadow: 0 0 24px rgba(0,255,65,.5);
}

button:active {
  background: #00cc33;
  border-color: #00cc33;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <span class="tag-top">// ACCESS_RESTRICTED</span>
    <span class="tag-tr">◆ PROT/1.0</span>
    <span class="tag-bl">HOST::{{.Domain}}</span>
    <span class="tag-br">SYS://AUTH</span>

    <h1>VERIFY<span class="cursor">_</span></h1>
    <p class="sub">&gt;_ enter access code to continue</p>

    {{if .Error}}
    <div class="err">▸ ACCESS DENIED — INVALID CODE. TRY AGAIN.</div>
    {{end}}

    <form method="POST" action="/__protect/otp">
      <input type="hidden" name="d" value="{{.Domain}}">
      <input type="hidden" name="p" value="{{.Path}}">
      <input type="hidden" name="back" value="{{.Back}}">
      <label>&gt;_ access code</label>
      <input type="text"
             name="code"
             autocomplete="off"
             autofocus
             maxlength="16"
             spellcheck="false"
             placeholder="_ _ _ _ _ _">
      <button type="submit">[ AUTHENTICATE ]</button>
    </form>
  </div>
</div>
</body>
</html>
